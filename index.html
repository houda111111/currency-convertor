<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Convertor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer"/>
</head>
<body>
    <div class="container">
        <h1>Currency convertor</h1>
        <div class="currency-container">
            <select id="currency-first">
                <option value="USD" selected>USD</option>
                <option value="EGP">EGP</option>
                <option value="SAR">SAR</option>
                <option value="AED">AED</option>
                <option value="EUR">EUR</option>
            </select>
            <input type="number" value="1" min="0" id="worth-first">
        </div>
        <div class="currency-container">
            <select id="currency-second">
                <option value="USD">USD</option>
                <option value="EGP" selected>EGP</option>
                <option value="SAR">SAR</option>
                <option value="AED">AED</option>
                <option value="EUR">EUR</option>
            </select>
            <input type="number" value="1" min="0" disabled id="worth-second">
        </div>
        <p class="exchange-rate" id="exchange-rate">1 USD = 50 EGP</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
